# Two layers over the mocked app (FUNDVISTA_UPSTREAM_MODE=mock - every
# third-party call is served from in-repo fixtures and unmocked hosts fail
# closed; see backend/upstream_mock/). Both run offline: no real data and no
# external services. The API integration tests run against a throwaway
# redis-server (backend/tests/redis_harness.py) and assert on the mock data
# that lands in Redis, so the CI runner needs redis-server installed.
#
#   1. integration  - the full pytest live-server suite, hermetic.
#   2. schemathesis - OpenAPI property fuzzing against the running mock-mode
#                     app (not_a_server_error only; ~2.7k cases / ~2 min),
#                     ops/schemathesis-smoke.sh; junit artifact on failure.
#
# Schemathesis finds whole request-shape bug classes the example-based
# suite misses (it caught normalize_icao 500 on its first CI-style run).
name: backend-tests

# A run dispatched for a PR is named apart from the `main` gate: both are
# attached to the head of `main`, and the sweep must tell them apart
# (.github/scripts/auto-merge-sweep.sh main_gate_state, active_gate_for_pr).
run-name: "${{ inputs.pr_number && format('backend-tests [merge-ref #{0}]', inputs.pr_number) || 'backend-tests' }}"

# No `paths` filter: the `main` ruleset requires the checks
# `integration (pytest)` and `schemathesis` on every pull request, and a
# workflow skipped by a path filter reports no check at all. Each job instead
# asks .github/scripts/backend-changes.sh whether a backend path changed; when
# none did, the job skips the suite and still reports success
# (docs/auto-merge.md §3).
on:
  push:
    branches: [main]
  pull_request:
  # Manual run, two modes:
  #   - no input: the suite on the dispatched ref.
  #   - pr_number=<n> and main_sha=<sha>: the suite against the PR head merged
  #     with that main commit. GitHub's own merge ref is not used: it is not
  #     rebuilt when `main` moves. The verdict is reported as the commit
  #     status `automerge/merge-ref/backend-tests` on the PR head, described
  #     `head <head> main <main>`, because the run itself is attached to
  #     `main` (see docs/auto-merge.md).
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number: test the PR head merged with main_sha"
        required: false
        type: string
        default: ""
      main_sha:
        description: "main commit to merge into the PR head (with pr_number)"
        required: false
        type: string
        default: ""

# The junit-report step annotates the commit with check runs - the default
# token is read-mostly, so checks:write must be granted explicitly.
# statuses:write is for the merge-ref verdict of the dispatched run.
permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: read

jobs:
  integration:
    # The name MUST match the required check of the `main` ruleset and the
    # sweep's AUTOMERGE_GATE_WORKFLOWS (.github/workflows/auto-merge.yml).
    name: integration (pytest)
    outputs:
      tested_head: ${{ steps.changes.outputs.tested_head }}
    # Pinned instead of ubuntu-latest: the label migrates to Ubuntu 26 and
    # the pinned image keeps the suite environment deterministic.
    runs-on: [self-hosted, linux, ARM64]
    steps:
      # The self-hosted runner is a Linux container without gh: fetch the binary
      # (no root needed) when it is missing.
      - name: Ensure gh
        run: |
          if ! command -v gh >/dev/null; then
            arch="$(uname -m)"; case "$arch" in aarch64|arm64) arch=arm64 ;; *) arch=amd64 ;; esac
            v=2.101.0
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_${arch}.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_${v}_linux_${arch}/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/checkout@v7
        with:
          # A dispatched run with pr_number checks out the PR head; the merge
          # with main is made by the step below. GitHub's refs/pull/<n>/merge
          # is not used: it is not rebuilt when `main` moves.
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}
          fetch-depth: ${{ inputs.pr_number && '0' || '1' }}
      - name: Detect backend changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A dispatched run names the PR head it tested, recorded before the
          # merge below: the verdict is about the PR head, not the merge commit.
          if [ -n "$DISPATCH_PR" ]; then
            echo "tested_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          bash .github/scripts/backend-changes.sh
      - name: No backend change, the suite is skipped
        if: ${{ steps.changes.outputs.backend != 'true' }}
        run: |
          echo "No backend path changed: the suite is skipped and the job reports success." >> "$GITHUB_STEP_SUMMARY"
      - name: Merge main into the PR head
        id: merge
        if: ${{ inputs.pr_number != '' && steps.changes.outputs.backend == 'true' }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          MAIN_SHA: ${{ inputs.main_sha }}
        run: |
          if ! [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::main_sha must be a full commit SHA (got '$MAIN_SHA')"
            exit 1
          fi
          git cat-file -e "${MAIN_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin main
          if ! git cat-file -e "${MAIN_SHA}^{commit}" 2>/dev/null; then
            echo "::error::main commit $MAIN_SHA is not in the repository"
            exit 1
          fi
          if ! git -c user.name="ci" -c user.email="ci@localhost" merge --no-edit "$MAIN_SHA"; then
            echo "::error::PR #$PR_NUMBER does not merge cleanly with main $MAIN_SHA"
            exit 1
          fi

      # actions/setup-python has no 3.13 build for the self-hosted debian/arm64
      # container: uv installs the interpreter and owns a venv instead.
      - uses: astral-sh/setup-uv@v7
        if: ${{ steps.changes.outputs.backend == 'true' }}
      - name: Set up Python 3.13
        if: ${{ steps.changes.outputs.backend == 'true' }}
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Lockfile is current (a deploy installs from backend/uv.lock)
        if: ${{ steps.changes.outputs.backend == 'true' }}
        working-directory: backend
        # Pinned and run through uvx: the runner's `uv` on PATH is not always
        # the one setup-uv installed, and the lock check flapped on it.
        run: uvx --from uv==0.13.5 uv lock --check

      - name: Install deps (uv reads backend/pyproject.toml + test group)
        if: ${{ steps.changes.outputs.backend == 'true' }}
        working-directory: backend
        run: |
          # `pip install ./backend` cannot work here: the repo root is the
          # import namespace (backend/ is one big package, not a wheel),
          # and setuptools flat-layout discovery fails on it. uv reads the
          # PEP 621 dependencies + the [dependency-groups] test group
          # (pytest, httpx, schemathesis) straight from backend/pyproject.toml.
          uv pip install -r pyproject.toml --group test

      - name: OCR system dep (pytesseract fallback path)
        if: ${{ steps.changes.outputs.backend == 'true' }}
        run: command -v tesseract >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr)

      # The API integration tests start their own redis-server and assert on
      # the mock data cached in it (backend/tests/redis_harness.py).
      - name: Redis server binary (API tests assert cache contents)
        if: ${{ steps.changes.outputs.backend == 'true' }}
        run: command -v redis-server >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq redis-server)

      - name: Run integration suite (live servers, mocked upstreams)
        if: ${{ steps.changes.outputs.backend == 'true' }}
        env:
          # Same hermetic defaults the suite sets itself (conftest.py); set
          # explicitly so the nested uvicorn subprocesses can never see a
          # developer-style environment.
          PENPLOT_DATA_DIR: /tmp/fundvista-testdata
          REDIS_CLOUD_URL: redis://127.0.0.1:1/0
          # Rate limiter genuinely off in CI (same switch as affilio).
          DISABLE_RATELIMIT: "True"
          PENPIXEL_HMAC_SECRET: test-secret-ci
          PYTHONPATH: .
          # Shared runner is loaded: wall-clock perf budgets get 3x headroom
          # (backend/tests/helpers.py perf_budget). Local runs keep 1.0.
          PERF_BUDGET_SCALE: "3"
        run: >
          python -m pytest backend/tests/ -q
          --junitxml=backend/reports/junit.xml
          --html=backend/reports/report.html --self-contained-html

      - name: Publish pytest results (check-run annotations)
        if: ${{ always() && steps.changes.outputs.backend == 'true' }}
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: integration (pytest report)
          report_paths: backend/reports/junit.xml

      - name: Upload pytest reports (junit + self-contained HTML)
        if: ${{ always() && steps.changes.outputs.backend == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-reports
          path: backend/reports/
          if-no-files-found: warn
          include-hidden-files: true

  schemathesis:
    # The name MUST match the required check of the `main` ruleset and the
    # sweep's AUTOMERGE_GATE_WORKFLOWS (.github/workflows/auto-merge.yml).
    name: schemathesis
    outputs:
      tested_head: ${{ steps.changes.outputs.tested_head }}
    runs-on: [self-hosted, linux, ARM64]
    steps:
      # The self-hosted runner is a Linux container without gh: fetch the binary
      # (no root needed) when it is missing.
      - name: Ensure gh
        run: |
          if ! command -v gh >/dev/null; then
            arch="$(uname -m)"; case "$arch" in aarch64|arm64) arch=arm64 ;; *) arch=amd64 ;; esac
            v=2.101.0
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_${arch}.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_${v}_linux_${arch}/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/checkout@v7
        with:
          # A dispatched run with pr_number checks out the PR head; the merge
          # with main is made by the step below. GitHub's refs/pull/<n>/merge
          # is not used: it is not rebuilt when `main` moves.
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}
          fetch-depth: ${{ inputs.pr_number && '0' || '1' }}
      - name: Detect backend changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A dispatched run names the PR head it tested, recorded before the
          # merge below: the verdict is about the PR head, not the merge commit.
          if [ -n "$DISPATCH_PR" ]; then
            echo "tested_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          bash .github/scripts/backend-changes.sh
      - name: No backend change, the suite is skipped
        if: ${{ steps.changes.outputs.backend != 'true' }}
        run: |
          echo "No backend path changed: the suite is skipped and the job reports success." >> "$GITHUB_STEP_SUMMARY"
      - name: Merge main into the PR head
        id: merge
        if: ${{ inputs.pr_number != '' && steps.changes.outputs.backend == 'true' }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          MAIN_SHA: ${{ inputs.main_sha }}
        run: |
          if ! [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::main_sha must be a full commit SHA (got '$MAIN_SHA')"
            exit 1
          fi
          git cat-file -e "${MAIN_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin main
          if ! git cat-file -e "${MAIN_SHA}^{commit}" 2>/dev/null; then
            echo "::error::main commit $MAIN_SHA is not in the repository"
            exit 1
          fi
          if ! git -c user.name="ci" -c user.email="ci@localhost" merge --no-edit "$MAIN_SHA"; then
            echo "::error::PR #$PR_NUMBER does not merge cleanly with main $MAIN_SHA"
            exit 1
          fi

      # actions/setup-python has no 3.13 build for the self-hosted debian/arm64
      # container: uv installs the interpreter and owns a venv instead.
      - uses: astral-sh/setup-uv@v7
        if: ${{ steps.changes.outputs.backend == 'true' }}
      - name: Set up Python 3.13
        if: ${{ steps.changes.outputs.backend == 'true' }}
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install deps (same as integration)
        if: ${{ steps.changes.outputs.backend == 'true' }}
        working-directory: backend
        run: |
          uv pip install -r pyproject.toml --group test

      - name: Schemathesis smoke (mock-mode server)
        if: ${{ steps.changes.outputs.backend == 'true' }}
        run: ./ops/schemathesis-smoke.sh .

      - name: Publish schemathesis results (check-run annotations)
        if: ${{ always() && steps.changes.outputs.backend == 'true' }}
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: schemathesis (smoke report)
          report_paths: schemathesis_results/schemathesis_smoke.xml

      - name: Upload test reports
        if: ${{ always() && steps.changes.outputs.backend == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: schemathesis-report
          path: |
            schemathesis_results/
            smoke-server.log
          if-no-files-found: ignore

  verdict:
    # Reports the verdict of a dispatched run as a commit status, so the
    # auto-merge sweep can read it (docs/auto-merge.md). A normal run needs
    # no verdict: its check runs are the verdict.
    name: verdict
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && needs.integration.result != 'cancelled' && needs.schemathesis.result != 'cancelled' }}
    needs: [integration, schemathesis]
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 5
    steps:
      # The self-hosted runner is a Linux container without gh: fetch the binary
      # (no root needed) when it is missing.
      - name: Ensure gh
        run: |
          if ! command -v gh >/dev/null; then
            arch="$(uname -m)"; case "$arch" in aarch64|arm64) arch=arm64 ;; *) arch=amd64 ;; esac
            v=2.101.0
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_${arch}.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_${v}_linux_${arch}/bin" >> "$GITHUB_PATH"
          fi
      - name: Report the merge-ref verdict
        # The sweep reads this status to know that the suite was green for
        # exactly this PR head and this main. A canceled run reports nothing.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW: ${{ github.workflow }}
          INTEGRATION: ${{ needs.integration.result }}
          SCHEMATHESIS: ${{ needs.schemathesis.result }}
          HEAD_INTEGRATION: ${{ needs.integration.outputs.tested_head }}
          HEAD_SCHEMATHESIS: ${{ needs.schemathesis.outputs.tested_head }}
          MAIN_SHA: ${{ inputs.main_sha }}
        run: |
          tested_head="$HEAD_INTEGRATION"
          if [ -z "$tested_head" ]; then
            echo "::error::no PR head was checked out, nothing to report"
            exit 1
          fi
          state=success
          if [ "$INTEGRATION" != success ] || [ "$SCHEMATHESIS" != success ]; then
            state=failure
          fi
          # Both jobs must have tested the same head, else the verdict is red.
          if [ -n "$HEAD_SCHEMATHESIS" ] && [ "$HEAD_SCHEMATHESIS" != "$tested_head" ]; then
            state=failure
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$tested_head" \
            -f state="$state" \
            -f context="automerge/merge-ref/$WORKFLOW" \
            -f description="head $tested_head main $MAIN_SHA"
