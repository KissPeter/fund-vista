# Frontend checks on pull requests.
#
# The backend has a hermetic live-server CI lane (backend-tests.yml); the
# frontend had NONE: backend-tests.yml's paths filter never covers a frontend
# path and deploy-pages.yml only runs on push to main. A PR that broke the
# frontend install, the lint or the type check was therefore green on CI.
#
# This lane closes that gap: install -> lint -> type check -> build.
# The type check is separate from the build on purpose: `npm run build` is
# `vite build` only and does NOT type-check, so TypeScript errors in src/
# would otherwise never fail a build.
name: frontend-checks

# A run dispatched for a PR is named apart from the `main` gate: both are
# attached to the head of `main`, and the sweep must tell them apart
# (.github/scripts/auto-merge-sweep.sh main_gate_state, active_gate_for_pr).
run-name: "${{ inputs.pr_number && format('frontend-checks [merge-ref #{0}]', inputs.pr_number) || 'frontend-checks' }}"

on:
  push:
    branches: [main]
    paths: &frontend_paths
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.app.json
      - tsconfig.node.json
      - eslint.config.js
      - vite.config.ts
      - .github/workflows/frontend-checks.yml
  pull_request:
    paths: *frontend_paths
  # Manual run, two modes (same contract as backend-tests):
  #   - no input: the checks on the dispatched ref.
  #   - pr_number=<n> and main_sha=<sha>: the checks against the PR head
  #     merged with that main commit (GitHub's merge ref is not rebuilt when
  #     `main` moves); the verdict is reported as the commit status
  #     `automerge/merge-ref/frontend-checks` on the PR head, described
  #     `head <head> main <main>` (see docs/auto-merge.md).
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number: test the PR head merged with main_sha"
        required: false
        type: string
        default: ""
      main_sha:
        description: "main commit to merge into the PR head (with pr_number)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  statuses: write
  pull-requests: read

jobs:
  checks:
    outputs:
      tested_head: ${{ steps.merge.outputs.tested_head }}
    # Self-hosted like backend-tests: the hosted runners are unavailable
    # (billing), and a lane that never runs would never turn green.
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v7
        with:
          # A dispatched run with pr_number checks out the PR head; the merge
          # with main is made by the step below. GitHub's refs/pull/<n>/merge
          # is not used: it is not rebuilt when `main` moves.
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}
          fetch-depth: ${{ inputs.pr_number && '0' || '1' }}
      - name: Merge main into the PR head
        id: merge
        if: ${{ inputs.pr_number != '' }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          MAIN_SHA: ${{ inputs.main_sha }}
        run: |
          # Recorded before the merge: the verdict names the PR head, not the
          # merge commit built here.
          echo "tested_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if ! [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::main_sha must be a full commit SHA (got '$MAIN_SHA')"
            exit 1
          fi
          git cat-file -e "${MAIN_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin main
          if ! git cat-file -e "${MAIN_SHA}^{commit}" 2>/dev/null; then
            echo "::error::main commit $MAIN_SHA is not in the repository"
            exit 1
          fi
          if ! git -c user.name="ci" -c user.email="ci@localhost" merge --no-edit "$MAIN_SHA"; then
            echo "::error::PR #$PR_NUMBER does not merge cleanly with main $MAIN_SHA"
            exit 1
          fi

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        # `npm ci --legacy-peer-deps` instead of plain `npm ci`: the lockfile
        # on main still resolves @vitejs/plugin-react-swc 3.11.0 against vite 8
        # and plain `npm ci` aborts with ERESOLVE (issue #91). The dependency
        # bump that fixes it is open PR #99 and not merged yet, so this lane
        # would go red before it starts. The flag is dropped together with
        # that PR. It changes no resolved version - the lockfile is still the
        # single source of truth.
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        # `npm run build` is `vite build` only - it does not type-check.
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        # The frontend test lane (node's built-in runner, no new dependency)
        # lands with PR #114. `--if-present` keeps this step green until the
        # script exists on the branch.
        run: npm test --if-present

  verdict:
    # Reports the verdict of a dispatched run as a commit status, so the
    # auto-merge sweep can read it. A normal run needs no verdict: its check
    # run is the verdict.
    name: verdict
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && needs.checks.result != 'cancelled' }}
    needs: [checks]
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 5
    steps:
      # The self-hosted runner is a Linux container without gh: fetch the binary
      # (no root needed) when it is missing.
      - name: Ensure gh
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null; then
            arch="$(uname -m)"; case "$arch" in aarch64|arm64) arch=arm64 ;; *) arch=amd64 ;; esac
            v=2.101.0
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_${arch}.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_${v}_linux_${arch}/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/gh_${v}_linux_${arch}/bin:$PATH"
          fi
          gh --version
      - name: Report the merge-ref verdict
        # The sweep reads this status to know that the checks were green for
        # exactly this PR head and this main. A canceled run reports nothing.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW: ${{ github.workflow }}
          CHECKS: ${{ needs.checks.result }}
          TESTED_HEAD: ${{ needs.checks.outputs.tested_head }}
          MAIN_SHA: ${{ inputs.main_sha }}
        run: |
          if [ -z "$TESTED_HEAD" ]; then
            echo "::error::no PR head was checked out, nothing to report"
            exit 1
          fi
          state=success
          if [ "$CHECKS" != success ]; then
            state=failure
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$TESTED_HEAD" \
            -f state="$state" \
            -f context="automerge/merge-ref/$WORKFLOW" \
            -f description="head $TESTED_HEAD main $MAIN_SHA"
