  <fieldset>
    <legend>{{ legend_page_pen }}</legend>
    <label>page size
      <select id="page_size">
      {% for s in page_sizes %}
        <option value="{{ s }}"{% if defaults.page.size|upper == s %} selected{% endif %}>{{ s }}</option>
      {% endfor %}
      </select>
    </label>
    <label>orientation
      <select id="page_orientation">
      {% for o in orientations %}
        <option value="{{ o }}"{% if defaults.page.orientation == o %} selected{% endif %}>{{ o }}</option>
      {% endfor %}
      </select>
    </label>
    <label>margin_mm <input type="range" id="page_margin_mm" min="0" max="50" step="1" value="{{ defaults.page.margin_mm }}"><output id="page_margin_mm_val">{{ defaults.page.margin_mm }}</output></label>
    <label>padding_mm <input type="range" id="page_padding_mm" min="0" max="20" step="0.5" value="{{ defaults.page.padding_mm }}"><output id="page_padding_mm_val">{{ defaults.page.padding_mm }}</output></label>
    <label>frame <input type="checkbox" id="page_frame"{% if defaults.page.frame %} checked{% endif %}></label>
    <label>frame_radius_mm <input type="range" id="page_frame_radius_mm" min="0" max="20" step="0.5" value="{{ defaults.page.frame_radius_mm }}"><output id="page_frame_radius_mm_val">{{ defaults.page.frame_radius_mm }}</output></label>
    <label>draw_speed_mm_s <input type="range" id="draw_speed_mm_s" min="5" max="200" step="5" value="{{ defaults.pen.draw_speed_mm_s }}"><output id="draw_speed_mm_s_val">{{ defaults.pen.draw_speed_mm_s }}</output></label>
    <label>travel_speed_mm_s <input type="range" id="travel_speed_mm_s" min="10" max="500" step="10" value="{{ defaults.pen.travel_speed_mm_s }}"><output id="travel_speed_mm_s_val">{{ defaults.pen.travel_speed_mm_s }}</output></label>
    <label>pen_lift_s <input type="range" id="pen_lift_s" min="0" max="2" step="0.1" value="{{ defaults.pen.pen_lift_s }}"><output id="pen_lift_s_val">{{ defaults.pen.pen_lift_s }}</output></label>
  </fieldset>
