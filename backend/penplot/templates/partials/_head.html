<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 1.5rem; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  fieldset { border: 1px solid #8884; border-radius: 8px; margin-bottom: 1rem; min-width: 0; }
  label { display: flex; justify-content: space-between; gap: .5rem; margin: .3rem 0; font-size: .9rem; overflow-wrap: anywhere; }
  input[type=range] { flex: 1; min-width: 0; }
  input[type=text] { flex: 1; min-width: 0; }
  output { min-width: 3.4rem; text-align: right; font-variant-numeric: tabular-nums; }
  select { width: 7rem; }
  input[type=file] { max-width: 100%; }
  #preview { width: 100%; border: 1px solid #8884; border-radius: 8px; background: #fff; min-height: 200px; }
  #map { width: 100%; height: 320px; border: 1px solid #8884; border-radius: 8px; }
  table { border-collapse: collapse; font-size: .9rem; }
  td, th { border: 1px solid #8884; padding: .2rem .6rem; text-align: right; }
  th { text-align: left; }
  code { font-size: .8rem; word-break: break-all; }
  #status { min-height: 1.5em; font-size: .9rem; }
  form.busy { opacity: .55; }
  form.busy :disabled { cursor: wait; }
  .warn { color: #a60; }
  .error { color: #c00; }
  .meta { font-size: .85rem; color: #666; word-break: break-all; }
</style>
