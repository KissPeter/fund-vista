[project]
name = "fund-vista"
version = "0.1.0"
description = "Fund-vista"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "brotli==1.2.0",
    "redis==5.1.1",
    # pydantic-settings replaces hand-rolled os.getenv/_env_int/_env_float config
    # parsing (validated, typed, fail-fast). Permissive (MIT) — meets spec §7.
    "pydantic-settings>=2.0",
    # Pen-plot v1 pipeline (all permissive licenses: HPND / BSD / Apache-2.0).
    # NOTE: Potrace (GPL-2.0) and vpype-flow-imager (GPL-3.0) are deliberately
    # NOT dependencies — see backend/penplot/methods.py.
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "python-multipart>=0.0.9",
    # SVG entity-expansion / external-reference protection for ET.fromstring
    # (review D.3.3). DefusedXML is permissive-licensed (Python/PSF), so §7's
    # permissive-only rule is unaffected.
    "defusedxml>=0.7",
    # Single-stroke SVGinOT title/table face (ZnikoSL-SVGinOT-8): SVG glyph
    # documents are parsed directly via fontTools (no rasterizer can draw
    # OT-SVG). MIT — permissive, meets spec §7.
    "fonttools>=4.50",
    # Boolean ops for the negative-space wordmark renderer
    # (backend/wordmark: glyph unions, gap-ring cuts, knockout/layered
    # modes). Pure wheels for every supported Python (no system libs —
    # FastAPI Cloud installs Python dependencies only).
    # BSD-3-Clause — permissive, meets spec §7.
    "skia-pathops>=0.8",
    # Server-rendered UI for the pen-plot endpoints (Jinja2 templates).
    # BSD-3-Clause — permissive, meets spec §7.
    "jinja2>=3.1",
    # Technical-drawing OCR (F-005), Apache-2.0. ``tesserocr`` ships Linux
    # wheels with libtesseract bundled (no apt needed - FastAPI Cloud installs
    # Python dependencies only); the English model is vendored in
    # penplot/tessdata. ``pytesseract`` + a ``tesseract`` binary is the
    # fallback elsewhere (macOS dev: brew install tesseract).
    "tesserocr>=2.8; sys_platform == 'linux'",
    "pytesseract>=0.3.10",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.poetry.dependencies]
python = "==3.13.*"
